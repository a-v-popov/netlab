---
description: Juniper vPTX
parent: junos
interface_name: et-0/0/{ifindex}
mgmt_if: "re0:mgmt-0"
group_vars:
  netlab_device_type: vptx

features:
  gateway:
    protocol: [ vrrp ]
  lag:
    passive: True
  vlan:
    model: l3-switch
    svi_interface_name: irb.{vlan}
    subif_name: "{ifname}.{vlan.access_id}"
    native_routed: true

libvirt:
  image: juniper/vptx
  build: https://netlab.tools/labs/vptx/
  pre_install: vptx
  #create_template: vptx.xml.j2
  create: virt-install --name vm_box --nographics --import
    --virt-type kvm
    --os-variant linux2024
    --memory 8128
    --vcpus 4
    --boot firmware=efi,firmware.feature0.enabled=no,firmware.feature0.name=secure-boot
    --disk path=vm.qcow2,bus=virtio
    --disk path=/tmp/vptx.bootstrap.qcow2,bus=usb,format=raw
    --network network=default,model=virtio
    --sysinfo bios.vendor=Bochs,bios.version=Bochs
    --sysinfo system.manufacturer=Bochs,system.product=Bochs,system.serial=chassis_no=0:slot=0:type=1:assembly_id=0x0D20:platform=251:master=0:channelized=no
    --sysinfo chassis.manufacturer=Bochs
    --serial pty

clab:
  image: vrnetlab/juniper_vjunosevolved:23.4R2-S2.1
  build: https://containerlab.dev/manual/kinds/vr-vjunosevolved/
  mtu: 1500
  node:
    kind: juniper_vjunosevolved
  interface:
    name: eth{ifindex+1}
  group_vars:
    ansible_user: admin
    ansible_ssh_pass: admin@123
    netlab_check_retries: 40
    netlab_check_delay: 10

graphite.icon: switch
